version: 2

build:
  os: ubuntu-22.04
  tools:
    # 3.13 breaks pathlib.Path docs; see https://github.com/sphinx-doc/sphinx/issues/13178
    python: "3.14"
  apt_packages:
    - tree
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --all-extras --no-default-groups --group manual-extras --group docs

    # pre_build:
    #   - python -m sphinx -b linkcheck docs/ _build/linkcheck  # Fails for valid GitHub links?

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf

submodules:
  include: all